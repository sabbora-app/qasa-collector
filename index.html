<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>جامع أصناف قاصة</title>
<style id="ds">
:root{
  --cyan:#06B6D4;--violet:#8B5CF6;--magenta:#EC4899;--blue:#2563EB;
  --ok:#22C55E;--warn:#FACC15;--bad:#F43F5E;
  --bg:#F8FAFF;--t1:#0F172A;--t2:#475569;--t3:#64748B;
  --g-aurora:linear-gradient(135deg,#0891B2,#7C3AED 55%,#DB2777);
  --g-ocean:linear-gradient(135deg,#0891B2,#2563EB);
  --g-violet:linear-gradient(135deg,#7C3AED,#C026D3);
  --g-ok:linear-gradient(135deg,#16A34A,#0D9488);
  --g-bad:linear-gradient(135deg,#E11D48,#BE123C);
  --glass:rgba(255,255,255,.55);
  --r1:10px;--r2:14px;--r3:20px;--r4:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--t1);font-size:16px;line-height:1.5;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(40vmax 40vmax at 90% 0%,rgba(6,182,212,.22),transparent 60%),
  radial-gradient(38vmax 38vmax at 0% 30%,rgba(139,92,246,.20),transparent 60%),
  radial-gradient(36vmax 36vmax at 100% 75%,rgba(236,72,153,.16),transparent 60%),
  radial-gradient(34vmax 34vmax at 10% 100%,rgba(37,99,235,.14),transparent 60%)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 8px 30px rgba(15,23,42,.08)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,.94)}}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;display:inline-block}
.en{direction:ltr;unicode-bidi:isolate}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-radius:0 0 var(--r3) var(--r3)}
.logo-slot{width:38px;height:38px;border-radius:50%;background:var(--g-aurora);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:0 4px 14px rgba(124,58,237,.35),inset 0 1px 0 rgba(255,255,255,.5);flex:none}
.topbar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{padding:14px;max-width:720px;margin:0 auto}
.card{border-radius:var(--r3);padding:14px;margin-bottom:12px}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;font:inherit;font-weight:700;color:#fff;height:46px;padding:0 18px;border-radius:var(--r2);display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--g-ocean);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.15),0 6px 16px rgba(37,99,235,.28);transition:transform .15s,box-shadow .15s}
.btn::after{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.lg{height:56px;font-size:17px;border-radius:var(--r3)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:var(--r1)}
.btn.aurora{background:var(--g-aurora);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.15),0 8px 22px rgba(124,58,237,.35)}
.btn.ok{background:var(--g-ok);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.15),0 6px 16px rgba(22,163,74,.3)}
.btn.bad{background:var(--g-bad);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.15),0 6px 16px rgba(225,29,72,.3)}
.btn.violet{background:var(--g-violet)}
.btn.ghost{background:rgba(255,255,255,.75);color:var(--t1);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.08)}
.btn.ghost::after{display:none}
.btn.block{width:100%}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(15,23,42,.1);cursor:pointer;color:var(--t1);flex:none}
.ibtn svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{border-radius:var(--r2);padding:10px;text-align:center}
.stat b{display:block;font-size:22px;background:var(--g-aurora);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--t3)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--t2);margin-bottom:5px}
.field label .req{color:var(--bad)}
input,select,textarea{width:100%;font:inherit;color:var(--t1);background:rgba(255,255,255,.85);border:1px solid rgba(100,116,139,.25);border-radius:var(--r2);padding:11px 12px;outline:none;box-shadow:inset 0 1px 2px rgba(15,23,42,.06)}
input:focus,select:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
textarea{min-height:70px;resize:vertical}
.search{position:relative;margin-bottom:12px}
.search input{padding-inline-start:40px;border-radius:var(--r3)}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--t3);fill:none;stroke-width:2}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{border-radius:var(--r2);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:70px}
.cat b{font-size:15px}
.cat span{font-size:12px;color:var(--t3)}
.cat:active{transform:scale(.98)}
.list .it{display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r2);margin-bottom:8px;cursor:pointer}
.thumb{width:52px;height:52px;border-radius:var(--r1);background:linear-gradient(135deg,#E0F2FE,#EDE9FE);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--t3)}
.thumb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.it .info{flex:1;min-width:0}
.it .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .info small{color:var(--t3);font-size:12px}
.it .price{font-weight:800;color:var(--blue);font-size:14px;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(139,92,246,.12);color:#6D28D9}
.badge.ok{background:rgba(34,197,94,.14);color:#15803D}
.badge.warn{background:rgba(250,204,21,.22);color:#854D0E}
.badge.bad{background:rgba(244,63,94,.14);color:#BE123C}
.alert{border-radius:var(--r2);padding:12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;background:rgba(250,204,21,.18);border:1px solid rgba(250,204,21,.5)}
.alert.info{background:rgba(6,182,212,.12);border-color:rgba(6,182,212,.4)}
.crumb{font-size:13px;color:var(--t3);margin-bottom:8px}
h2{font-size:16px;margin:4px 0 10px}
.empty{text-align:center;color:var(--t3);padding:30px 10px}
.fab{position:fixed;inset-inline:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:10px;max-width:692px;margin:0 auto}
.photo-box{border-radius:var(--r2);border:2px dashed rgba(139,92,246,.35);min-height:150px;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.5);position:relative}
.photo-box img{width:100%;max-height:260px;object-fit:contain;display:block}
.photo-box .ph{color:var(--t3);text-align:center;font-size:14px}
.photo-box .ph svg{width:36px;height:36px;stroke:var(--violet);fill:none;stroke-width:1.6;display:block;margin:0 auto 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgr .mrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r1);background:rgba(255,255,255,.6);margin-bottom:6px}
.mgr .mrow.sub{margin-inline-start:22px;background:rgba(255,255,255,.4)}
.mgr .mrow b{flex:1;font-size:14px}
.mgr .mrow span{flex:1;font-size:14px}
.mgr .ibtn{width:34px;height:34px}
.mgr .ibtn svg{width:17px;height:17px}
/* scanner */
#scanner{position:fixed;inset:0;background:#000;z-index:50;display:none}
#scanner.on{display:block}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scanner .frame{position:absolute;left:50%;top:42%;width:min(80vw,360px);height:min(40vw,180px);transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.9)}
#scanner .frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#F43F5E;box-shadow:0 0 10px #F43F5E;animation:scanl 1.6s ease-in-out infinite}
@keyframes scanl{0%,100%{transform:translateY(-60px)}50%{transform:translateY(60px)}}
#scanner .bar{position:absolute;left:0;right:0;bottom:0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
#scanner .msg{position:absolute;left:0;right:0;top:calc(20px + env(safe-area-inset-top));text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 4px #000}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.35);display:none;align-items:flex-end;justify-content:center;padding:14px}
#modal.on{display:flex}
#modal .box{width:100%;max-width:480px;border-radius:var(--r4);padding:18px;margin-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.92)}
#modal h3{margin:0 0 12px;font-size:17px}
#modal .acts{display:flex;gap:10px;margin-top:14px}
#modal .acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:rgba(15,23,42,.88);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.muted{color:var(--t3);font-size:13px}
.progress{height:8px;border-radius:99px;background:rgba(100,116,139,.15);overflow:hidden}
.progress i{display:block;height:100%;background:var(--g-aurora)}
/* الجمع الذكي */
#smart{position:fixed;inset:0;background:#000;z-index:55;display:none;-webkit-user-select:none;user-select:none}
#smart.on{display:block}
#smart video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sm-top{position:absolute;top:0;left:0;right:0;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center;justify-content:space-between}
.sm-cat{border:0;border-radius:99px;padding:9px 14px;font:inherit;font-weight:800;color:#fff;background:rgba(15,23,42,.6);max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-cnt{display:flex;gap:6px;color:#fff;font-weight:800;font-size:13px}
.sm-cnt span{background:rgba(15,23,42,.6);border-radius:99px;padding:6px 10px}
.sm-frame{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);border-radius:18px;border:3px solid rgba(255,255,255,.92);box-shadow:0 0 0 100vmax rgba(0,0,0,.35);transition:all .25s}
.sm-frame.bar{width:min(86vw,380px);height:min(42vw,190px)}
.sm-frame.face{width:min(80vw,360px);height:min(100vw,440px);border-color:#FACC15}
.sm-frame.hit{border-color:#22C55E;box-shadow:0 0 0 100vmax rgba(34,197,94,.25)}
.sm-msg{position:absolute;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-weight:800;font-size:19px;text-shadow:0 2px 6px #000}
.sm-sub{position:absolute;left:12px;right:12px;bottom:calc(126px + env(safe-area-inset-bottom));text-align:center;color:#E2E8F0;font-size:13px;text-shadow:0 1px 4px #000}
.sm-ring{position:absolute;left:20%;right:20%;bottom:calc(112px + env(safe-area-inset-bottom));height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.sm-ring i{display:block;height:100%;width:0;background:#22C55E;transition:width .1s}
.sm-last{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;transition:.25s;background:rgba(255,255,255,.95);color:var(--t1);font-weight:800;padding:8px 16px;border-radius:99px;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-last.on{opacity:1;transform:translate(-50%,0)}
.sm-last.ok{background:#DCFCE7;color:#166534}.sm-last.warn{background:#FEF3C7;color:#92400E}
.sm-bar{position:absolute;left:0;right:0;bottom:0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.sm-bar .btn{flex:1;max-width:160px}
#smTorch.on{background:#FDE68A}
.smart-card{border-radius:var(--r3);padding:16px;margin-bottom:12px;color:#fff;background:var(--g-aurora);box-shadow:0 10px 26px rgba(124,58,237,.35);cursor:pointer;display:flex;gap:12px;align-items:center}
.smart-card b{font-size:18px;display:block}.smart-card small{opacity:.92}
.cat.sel{outline:3px solid var(--violet)}
.rv{border-radius:var(--r3);padding:12px;margin-bottom:10px}
.rv.flag{border:2px solid #FACC15}
.rv .field{margin-bottom:8px}
.rv input,.rv select{padding:9px 10px}
</style>
</head>
<body>

<header class="topbar glass">
  <button class="ibtn hidden" id="backBtn" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="logo-slot">ج</div>
  <h1 id="title">جامع أصناف قاصة</h1>
  <button class="ibtn" id="setBtn" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<main class="wrap" id="view"></main>

<div class="fab" id="fab">
  <button class="btn ghost lg" id="manualBtn" style="flex:0 0 auto;padding:0 16px" aria-label="إدخال يدوي"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="btn aurora lg grow" id="scanBtn"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>مسح باركود</button>
</div>

<div id="scanner">
  <video id="video" playsinline muted></video>
  <div class="msg" id="scanMsg">وجّه الكاميرا نحو الباركود</div>
  <div class="frame"></div>
  <div class="bar">
    <button class="btn ghost" id="torchBtn"><svg viewBox="0 0 24 24"><path d="M9 2h6l-1 7h4l-8 13 1-9H7z"/></svg>الإضاءة</button>
    <button class="btn ghost" id="typeBtn">كتابة الرقم</button>
    <button class="btn bad" id="closeScan">إغلاق</button>
  </div>
</div>

<div id="smart">
  <video id="sv" playsinline muted></video>
  <div class="sm-frame bar" id="smFrame"></div>
  <div class="sm-top"><button class="sm-cat" id="smCat">📦 —</button>
    <div class="sm-cnt"><span>⏳ <b class="num" id="smWork">0</b></span><span>✓ <b class="num" id="smReady">0</b></span><span>⚠ <b class="num" id="smErr">0</b></span></div></div>
  <div class="sm-last" id="smLast"></div>
  <div class="sm-msg" id="smMsg"></div>
  <div class="sm-sub" id="smSub"></div>
  <div class="sm-ring"><i id="smRing"></i></div>
  <div class="sm-bar">
    <button class="btn ghost" id="smTorch">الإضاءة</button>
    <button class="btn ghost hidden" id="smSkip">تخطي الصورة</button>
    <button class="btn aurora" id="smDone">إنهاء ومراجعة</button>
  </div>
</div>

<div id="modal"><div class="box glass" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileInput" class="hidden">

<script src="xlsx.mini.min.js"></script>
<script src="jszip.min.js"></script>
<script src="zxing.min.js"></script>
<script>
'use strict';
/* ================= الثوابت ================= */
const UNITS = ['غرام','كغم','مل','لتر','قطعة','علبة','كيس','باكيت'];
const COUNTRIES = ['العراق','تركيا','السعودية','الإمارات','إيران','الأردن','الكويت','مصر','سوريا','لبنان','الصين','الهند','ماليزيا','إندونيسيا','ألمانيا','فرنسا','إسبانيا','إيطاليا','هولندا','بولندا','أوكرانيا','روسيا','البرازيل','أمريكا'];
const DEFAULT_CATS = [

 ['مشروبات غازية وطاقة',['مشروبات غازية','مشروبات طاقة','شعير']],
 ['عصائر',['عصير معلب','عصير كرتون','شراب مركز']],
 ['مياه',['مياه صغيرة','مياه كبيرة']],
 ['شاي وقهوة',['شاي','قهوة','مشروبات فورية']],
 ['رز وبقوليات وطحين',['رز','عدس','حمص وفاصوليا','برغل وجريش','طحين']],
 ['زيوت وسمن',['زيت نباتي','زيت زيتون','سمن']],
 ['سكر وملح وتوابل',['سكر','ملح','بهارات','مرق ومكعبات']],
 ['معلبات',['معجون طماطم','تونة وسردين','بقوليات معلبة','خضار معلبة','مربى وعسل']],
 ['معكرونة وشعرية',['معكرونة','شعرية','نودلز']],
 ['حلويات وبسكويت',['بسكويت','كيك','شوكولاتة','علكة وحلوى','شيبس']],
 ['مكسرات وبذور',['مكسرات','حب وبذور']],
 ['فطور ومعجنات',['خبز وصمون','حبوب الفطور','حلاوة وطحينة']],
 ['مجمدات ولحوم',['دجاج مجمد','لحوم مجمدة','خضار مجمدة','نقانق ومرتديلا']],
 ['منظفات',['مسحوق غسيل','سائل جلي','معقمات','منظف أرضيات','معطر جو']],

/* ================= قاعدة البيانات ================= */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('qasa-collector',2);
    r.onupgradeneeded = ()=>{
      const d = r.result;
      for(const [n,k] of [['items','barcode'],['photos','barcode'],['meta','key'],['queue','barcode']])
        if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:k});
    };
    r.onsuccess = ()=>{db=r.result;res()};
    r.onerror = ()=>rej(r.error);
  });
}
function req(store,mode,fn){
  return new Promise((res,rej)=>{
    const t = db.transaction(store,mode); const s = t.objectStore(store);
    const r = fn(s);
    t.oncomplete = ()=>res(r && 'result' in r ? r.result : undefined);
    t.onerror = ()=>rej(t.error);
  });
}
const dbGet=(s,k)=>req(s,'readonly',x=>x.get(k));
const dbAll=(s)=>req(s,'readonly',x=>x.getAll());
const dbPut=(s,v)=>req(s,'readwrite',x=>x.put(v));
const dbDel=(s,k)=>req(s,'readwrite',x=>x.delete(k));
const dbKeys=(s)=>req(s,'readonly',x=>x.getAllKeys());

  queue.forEach(j=>{ if(j.status==='work') j.status='wait'; Q.set(j.barcode,j); });
  items.forEach(i=>S.items.set(i.barcode,i));
  keys.forEach(k=>S.photoKeys.add(k));

  else { S.cats = DEFAULT_CATS.map(([n,subs])=>({id:uid(),name:n,subs:subs.map(s=>({id:uid(),name:s}))})); await saveMeta('cats'); }

/* فحص رقم التحقق لباركودات EAN وUPC */
function checkDigitOk(code){
  if(!/^\d+$/.test(code) || ![8,12,13,14].includes(code.length)) return null;
  const d=code.split('').map(Number), last=d.pop();
  let sum=0; d.reverse().forEach((x,i)=>sum+=x*(i%2===0?3:1));
  return (10-sum%10)%10===last;
}
function normalize(code){
  code=String(code).trim().replace(/\s+/g,'');
  if(/^\d{12}$/.test(code) && checkDigitOk(code)) code='0'+code; // UPC-A إلى EAN-13
  return code;
}
function internalCode(){
  // باركود داخلي يبدأ بـ 29 للأصناف التي ليس لها باركود (20 إلى 28 محجوزة لموازين المحلات)
  let base; do{ base='29'+String(Date.now()).slice(-8)+String(Math.floor(Math.random()*100)).padStart(2,'0'); }
  while(S.items.has(base+cd(base)));
  return base+cd(base);
  function cd(b){ let s=0; b.split('').reverse().forEach((x,i)=>s+=Number(x)*(i%2===0?3:1)); return (10-s%10)%10; }
}
async function thumbURL(bc){
  if(!S.photoKeys.has(bc)) return null;
  if(thumbs.has(bc)) return thumbs.get(bc);
  const p = await dbGet('photos',bc); if(!p) return null;
  const u = URL.createObjectURL(p.blob); thumbs.set(bc,u); return u;
}
function dropThumb(bc){ if(thumbs.has(bc)){ URL.revokeObjectURL(thumbs.get(bc)); thumbs.delete(bc);} }
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1000, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error('compress')),'image/jpeg',.75);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};
    img.src=u;
  });
}
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain();
    o.frequency.value=1500; g.gain.value=.12; o.connect(g); g.connect(a.destination); o.start(); setTimeout(()=>{o.stop();a.close()},120);}catch(e){}
  if(navigator.vibrate) navigator.vibrate(80);
}

function modal(html,onOpen){
  $('#modalBox').innerHTML=html; $('#modal').classList.add('on');

}
function closeModal(){ $('#modal').classList.remove('on'); $('#modalBox').innerHTML=''; }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function ask(title,value='',opts={}){
  return new Promise(res=>{
    modal(`<h3>${esc(title)}</h3><input id="askIn" value="${esc(value)}" ${opts.numeric?'inputmode="numeric"':''} placeholder="${esc(opts.ph||'')}">
      <div class="acts"><button class="btn ok" id="askOk">موافق</button><button class="btn ghost" id="askNo">إلغاء</button></div>`,b=>{
      const i=b.querySelector('#askIn'); setTimeout(()=>i.focus(),50);
      const done=v=>{closeModal();res(v)};
      b.querySelector('#askOk').onclick=()=>done(i.value.trim());
      b.querySelector('#askNo').onclick=()=>done(null);
      i.onkeydown=e=>{ if(e.key==='Enter') done(i.value.trim()); };
    });
  });
}
function confirmBox(title,text,danger=true){
  return new Promise(res=>{
    modal(`<h3>${esc(title)}</h3><p class="muted">${esc(text)}</p>

      b.querySelector('#cY').onclick=()=>{closeModal();res(true)};
      b.querySelector('#cN').onclick=()=>{closeModal();res(false)};

  });
}

let stack=[];
function go(name,params={},push=true){
  if(push){ stack.push({name,params}); history.pushState({d:stack.length},''); }
  render();
}
function back(){ if(stack.length>1) history.back(); }
window.addEventListener('popstate',()=>{
  if($('#scanner').classList.contains('on')){ stopScanner(); return; }
  if($('#smart').classList.contains('on')){ stopSmart(); render(); return; }
  if($('#modal').classList.contains('on')){ closeModal(); history.pushState({d:stack.length},''); return; }
  if(stack.length>1){ stack.pop(); render(); } else history.pushState({d:1},'');
});
$('#backBtn').onclick=back;
$('#setBtn').onclick=()=>{ if(cur().name!=='settings') go('settings'); };
const cur=()=>stack[stack.length-1];

function render(){
  const v=cur(); const root=$('#view');
  $('#backBtn').classList.toggle('hidden',stack.length<=1);
  $('#fab').classList.toggle('hidden',['form','settings','smart','review'].includes(v.name));
  window.scrollTo(0,0);
  ({home:viewHome,cat:viewCat,sub:viewSub,form:viewForm,settings:viewSettings,smart:viewSmart,review:viewReview})[v.name](root,v.params);
}

/* ================= الماسح ================= */
let stream=null, scanTimer=null, zreader=null, lastRead='', lastCount=0, scanning=false;
async function startScanner(){
  if(scanning) return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ camHelp('insecure'); return; }
  scanning=true; lastRead=''; lastCount=0;
  $('#scanner').classList.add('on'); $('#scanMsg').textContent='وجّه الكاميرا نحو الباركود';
  history.pushState({scan:1},'');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){ scanning=false; $('#scanner').classList.remove('on'); history.back(); setTimeout(()=>camHelp(e&&e.name),250); return; }
  const v=$('#video'); v.srcObject=stream; try{ await v.play(); }catch(e){}
  const track=stream.getVideoTracks()[0];
  const caps=track.getCapabilities?track.getCapabilities():{};
  $('#torchBtn').classList.toggle('hidden',!caps.torch);
  let det=null;
  if('BarcodeDetector' in window){
    try{
      const sup=await BarcodeDetector.getSupportedFormats();
      const want=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'].filter(f=>sup.includes(f));
      if(want.length) det=new BarcodeDetector({formats:want});
    }catch(e){ det=null; }
  }
  if(det){
    const loop=async()=>{
      if(!scanning) return;
      try{ const r=await det.detect(v); if(r.length) onRead(r[0].rawValue); }catch(e){}
      scanTimer=setTimeout(loop,140);
    };
    loop();
  }else{
    const Z=window.ZXing, hints=new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF]);
    zreader=new Z.BrowserMultiFormatReader(hints,150);
    zreader.decodeFromStream(stream,v,(res)=>{ if(res) onRead(res.getText()); });
  }
}
function camHelp(reason){
  const why={
    insecure:'الصفحة مفتوحة كملف محلي أو داخل متصفح تطبيق آخر، والمتصفح لا يسمح بالكاميرا إلا لصفحة منشورة على رابط https.',
    NotAllowedError:'تم رفض إذن الكاميرا لهذا الموقع، أو أن Chrome نفسه ليس عنده إذن الكاميرا في إعدادات الهاتف.',
    SecurityError:'المتصفح منع الكاميرا لأسباب أمنية (غالباً الصفحة مفتوحة داخل تطبيق آخر).',
    NotFoundError:'لم يُعثر على كاميرا في الجهاز.',
    NotReadableError:'الكاميرا مشغولة بتطبيق آخر. أغلق التطبيقات الأخرى وحاول مجدداً.',
    OverconstrainedError:'الكاميرا لم تقبل الإعدادات المطلوبة.'
  }[reason]||('سبب غير معروف'+(reason?` (${reason})`:''));
  modal(`<h3>الكاميرا لا تعمل</h3><p class="muted">${esc(why)}</p>
    <ol class="muted" style="padding-inline-start:18px;margin:8px 0">
      <li>افتح الرابط في Chrome نفسه، لا داخل واتساب أو تطبيق GitHub.</li>
      <li>اضغط القفل بجانب الرابط ← الأذونات ← الكاميرا ← سماح.</li>
      <li>إعدادات الهاتف ← التطبيقات ← Chrome ← الأذونات ← الكاميرا ← سماح.</li>
    </ol>
    <button class="btn aurora block" id="hPhoto">${IC.cam}امسح من صورة بدلاً من ذلك</button>
    <div class="acts"><button class="btn ghost" id="hType">كتابة الرقم</button><button class="btn ghost" id="hNo">إغلاق</button></div>`,b=>{
    b.querySelector('#hPhoto').onclick=()=>{ closeModal(); scanFromPhoto(); };
    b.querySelector('#hType').onclick=()=>{ closeModal(); manualEntry(); };
    b.querySelector('#hNo').onclick=closeModal;
  });
}
/* بديل: التقاط صورة بتطبيق الكاميرا ثم قراءة الباركود منها */
function scanFromPhoto(){
  const p=$('#photoInput'); p.value='';
  p.onchange=async()=>{
    const f=p.files[0]; if(!f) return;
    toast('جاري قراءة الباركود...');
    const code=await decodeImage(f);
    if(!code){ toast('لم أجد باركوداً واضحاً — صوّره عن قرب وبإضاءة جيدة'); return; }
    beep(); openItem(code);
  };
  p.click();
}
async function decodeImage(file){
  if('BarcodeDetector' in window){
    try{ const bmp=await createImageBitmap(file); const r=await new BarcodeDetector().detect(bmp);
      const hit=r.map(x=>normalize(x.rawValue)).find(c=>checkDigitOk(c)!==false); if(hit) return hit; }catch(e){}
  }
  const u=URL.createObjectURL(file);
  try{
    const Z=window.ZXing, hints=new Map(); hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const r=await new Z.BrowserMultiFormatReader(hints).decodeFromImageUrl(u);
    const c=normalize(r.getText()); return checkDigitOk(c)===false?null:c;
  }catch(e){ return null; } finally{ URL.revokeObjectURL(u); }
}
function onRead(raw){
  if(!scanning) return;
  const code=normalize(raw);
  const ok=checkDigitOk(code);
  if(ok===false) return;                      // قراءة خاطئة، ننتظر قراءة أوضح
  if(ok===null){                              // أنواع بلا رقم تحقق: نطلب قراءتين متطابقتين
    if(code===lastRead) lastCount++; else { lastRead=code; lastCount=1; }
    if(lastCount<2) return;
  }
  beep(); stopScanner(true); openItem(code);
}
function stopScanner(fromRead){
  scanning=false; clearTimeout(scanTimer);
  if(zreader){ try{ zreader.reset(); }catch(e){} zreader=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $('#video').srcObject=null; $('#scanner').classList.remove('on');
  if(fromRead===true && history.state && history.state.scan) history.replaceState({d:stack.length},'');
}
$('#scanBtn').onclick=startScanner;
$('#closeScan').onclick=()=>history.back();
$('#torchBtn').onclick=async()=>{
  if(!stream) return; const t=stream.getVideoTracks()[0];
  t._torch=!t._torch; try{ await t.applyConstraints({advanced:[{torch:t._torch}]}); }catch(e){ toast('الإضاءة غير مدعومة'); }
};

/* ---------- الاتصال بالوظيفة ---------- */
async function api(action, body={}, ms=90000){
  if(!cloudOn()) throw new Error('اضبط رابط الوظيفة والرمز السري من الإعدادات');
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),ms);
  let r, j;
  try{
    r=await fetch(S.set.cloudUrl,{method:'POST',signal:ctl.signal,
      headers:{'content-type':'application/json','x-qasa-pin':S.set.cloudPin},body:JSON.stringify({action,...body})});
    j=await r.json().catch(()=>({}));
  }catch(e){ throw new Error(e.name==='AbortError'?'انتهت مهلة الاتصال':'لا يوجد اتصال بالإنترنت'); }
  finally{ clearTimeout(t); }
  if(!r.ok || j.error) throw new Error(j.error || ('خطأ '+r.status));
  return j;
}
function blobToB64(blob){
  return new Promise((res,rej)=>{ const f=new FileReader(); f.onload=()=>res(String(f.result).split(',')[1]); f.onerror=rej; f.readAsDataURL(blob); });
}
async function offLookup(code){
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_ar,brands,quantity`,{signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok) return null;                                  // 404 = غير موجود
    const j=await r.json(); if(j.status!==1||!j.product) return null;
    const p=j.product, name=p.product_name_ar||p.product_name||'';
    if(!name && !p.brands) return null;
    return {name, brand:p.brands||'', quantity:p.quantity||''};
  }catch(e){ return null; }
}

/* ---------- الأصوات ---------- */
let AC=null;
function tone(f,ms,when=0){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+when;
    o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+ms/1000+.02); }catch(e){}
}
function sound(k){
  if(k==='ok'){ tone(1600,90); vib(50); }
  else if(k==='cap'){ tone(1900,70); tone(1900,70,.12); vib([40,40,40]); }
  else if(k==='exists'){ tone(620,180); vib(120); }
  else if(k==='err'){ tone(300,250); vib(200); }
}
function vib(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }

/* ---------- الباركود ---------- */
function upcEtoA(e){
  const n=e[0], d=e.slice(1,7), c=e[7], x=d[5]; let m;
  if(x<='2') m=d[0]+d[1]+x+'0000'+d[2]+d[3]+d[4];
  else if(x==='3') m=d[0]+d[1]+d[2]+'00000'+d[3]+d[4];
  else if(x==='4') m=d[0]+d[1]+d[2]+d[3]+'00000'+d[4];
  else m=d[0]+d[1]+d[2]+d[3]+d[4]+'0000'+x;
  return n+m+c;
}
function normCode(raw,fmt){
  let s=String(raw||'').replace(/\D/g,'');
  if((fmt==='upc_e'||fmt==='UPC_E') && s.length===8) s=upcEtoA(s);
  return normalize(s);
}
async function setupDetector(){
  SM.det=null; SM.zx=null;
  if('BarcodeDetector' in window){
    try{ const sup=await BarcodeDetector.getSupportedFormats();
      const f=['ean_13','ean_8','upc_a','upc_e'].filter(x=>sup.includes(x));
      if(f.length) SM.det=new BarcodeDetector({formats:f}); }catch(e){}
  }
  if(!SM.det && window.ZXing){
    const Z=window.ZXing, h=new Map();
    h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    SM.zx=new Z.MultiFormatReader(); SM.zx.setHints(h);
  }
  return !!(SM.det||SM.zx);
}
async function detectOn(canvas){
  try{
    if(SM.det){ const r=await SM.det.detect(canvas); return r.map(x=>({raw:x.rawValue,fmt:x.format})); }
    const Z=window.ZXing;
    const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
    try{ const o=SM.zx.decodeWithState(bmp); return [{raw:o.getText(),fmt:Z.BarcodeFormat[o.getBarcodeFormat()]}]; }catch(e){ return []; }
  }catch(e){ return []; }
}
function drawROI(v,fw,fh,maxW){
  const W=v.videoWidth,H=v.videoHeight, rw=W*fw, rh=H*fh, x=(W-rw)/2, y=(H-rh)/2, k=Math.min(1,maxW/rw);
  cvA.width=Math.round(rw*k); cvA.height=Math.round(rh*k);
  cxA.drawImage(v,x,y,rw,rh,0,0,cvA.width,cvA.height);
  return cvA;
}

/* ---------- قياس الوضوح والثبات ---------- */
function frameStats(v){
  const W=v.videoWidth,H=v.videoHeight, rw=W*.8, rh=H*.8, w=160, h=Math.max(40,Math.round(160*rh/rw));
  cvG.width=w; cvG.height=h; cxG.drawImage(v,(W-rw)/2,(H-rh)/2,rw,rh,0,0,w,h);
  const px=cxG.getImageData(0,0,w,h).data, g=new Uint8Array(w*h);
  let sum=0;
  for(let i=0,j=0;i<px.length;i+=4,j++){ const y=(px[i]*77+px[i+1]*150+px[i+2]*29)>>8; g[j]=y; sum+=y; }
  let ls=0, ls2=0, n=0;
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const k=y*w+x, l=4*g[k]-g[k-1]-g[k+1]-g[k-w]-g[k+w]; ls+=l; ls2+=l*l; n++;
  }
  const mean=ls/n, sharp=ls2/n-mean*mean;
  let motion=255;
  if(SM.prev && SM.prev.length===g.length){ let d=0; for(let i=0;i<g.length;i++) d+=Math.abs(g[i]-SM.prev[i]); motion=d/g.length; }
  SM.prev=g;
  return {bright:sum/g.length, sharp, motion};
}

function smFace(code){
  SM.state='face'; SM.cur={code}; SM.t0=performance.now(); SM.prev=null; SM.stableN=0; SM.barSeenAt=SM.t0; SM.maxSharp=0; SM.fc=0;

async function smLoop(){
  if(SM.state==='off') return;
  const v=$('#sv');
  if(v.readyState>=2 && v.videoWidth){
    try{ if(SM.state==='bar') await smBarStep(v); else if(SM.state==='face') await smFaceStep(v); }catch(e){}
  }
  SM.timer=setTimeout(smLoop, SM.state==='face'?80:40);
}
async function smBarStep(v){
  const hits=await detectOn(drawROI(v,.9,.55,720));
  if(!hits.length) return;
  const code=normCode(hits[0].raw,hits[0].fmt);
  if(checkDigitOk(code)!==true) return;
  const now=performance.now(), last=SM.recent.get(code);
  if(last && now-last<4000){ SM.recent.set(code,now); return; }
  if(SM.cand&&SM.cand.code===code) SM.cand.n++; else SM.cand={code,n:1};
  const known=S.items.has(code)||Q.has(code);
  if(SM.cand.n<(known?2:3)) return;                // تأكيد ذكي: 2 للموجود و3 للجديد
  SM.cand=null; SM.recent.set(code,now);
  if(S.items.has(code)){ sound('exists'); smLast('موجود مسبقاً: '+(S.items.get(code).name||code),'warn'); return; }
  if(Q.has(code)){ sound('exists'); smLast('مصوَّر في هذه الجلسة','warn'); return; }
  sound('ok'); smFace(code);
}
async function smFaceStep(v){
  const now=performance.now(), el=now-SM.t0, sens=SENS[S.set.smartSens||'normal'];
  const st=frameStats(v);
  if(++SM.fc%3===0){
    const hits=await detectOn(drawROI(v,.95,.95,640));
    if(hits.some(h=>normCode(h.raw,h.fmt)===SM.cur.code)) SM.barSeenAt=now;
  }
  const barVisible=now-SM.barSeenAt<500;
  const lightOk=st.bright>38 && st.bright<240;
  // بعد 3 ثوانٍ تتساهل الشروط تدريجياً حتى لا تعلق اليد المرتجفة
  const relax=Math.max(0,(el-3000)/3000);
  const stable=st.motion<sens.m*(1+relax);
  SM.stableN=stable?SM.stableN+1:0;
  if(stable && el>500) SM.maxSharp=Math.max(SM.maxSharp,st.sharp);
  const sharpOk=st.sharp>=Math.max(12,SM.maxSharp*Math.max(.55,.82-relax*.1));
  let msg;
  if(!lightOk) msg=st.bright<=38?'الإضاءة ضعيفة — شغّل الإضاءة':'الضوء قوي جداً — غيّر الزاوية';
  else if(barVisible && el<2600) msg='اقلب المنتج على وجهه';
  else if(!stable) msg='ثبّت المنتج قليلاً';
  else if(!sharpOk) msg='قرّب أو ابعد قليلاً حتى تتضح الصورة';
  else msg='ثابت… لحظة';
  $('#smMsg').textContent=msg;
  $('#smRing').style.width=Math.min(100,SM.stableN/sens.n*100)+'%';
  const ready=el>700 && lightOk && SM.stableN>=sens.n && sharpOk && !(barVisible && el<2600);
  if(ready){ await smCapture(v); return; }
  if(el>15000){ await smQueue(SM.cur.code,null); sound('err'); smLast('لم تُلتقط صورة — صوّره من المراجعة','warn'); smBar(); }
}
function grabFull(v){
  const W=v.videoWidth,H=v.videoHeight,k=Math.min(1,1280/Math.max(W,H)), c=document.createElement('canvas');
  c.width=Math.round(W*k); c.height=Math.round(H*k); c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.82));
}
async function smCapture(v){
  const code=SM.cur.code, blob=await grabFull(v);
  sound('cap');
  const f=$('#smFrame'); f.classList.add('hit'); setTimeout(()=>f.classList.remove('hit'),300);
  await smQueue(code,blob);
  smLast('✓ تم — المنتج التالي','ok');
  SM.recent.set(code,performance.now());
  smBar();
}
async function smQueue(code,blob){

  const j={barcode:code,catId:SM.cat,status:blob?'wait':'nophoto',tries:0,at:0,createdAt:Date.now()};

function smLast(t,cls){ const l=$('#smLast'); l.textContent=t; l.className='sm-last on '+(cls||''); clearTimeout(l._h); l._h=setTimeout(()=>l.classList.remove('on'),1800); }
function updateHud(){

/* ---------- المعالجة في الخلفية ---------- */
let qRun=0;
function pump(){
  if(!cloudOn()||!navigator.onLine) return;
  for(const j of Q.values()){
    if(qRun>=2) break;
    const due=j.status==='wait' || (j.status==='error' && j.tries<3 && Date.now()-j.at>j.tries*20000);
    if(due) runJob(j);
  }
}
setInterval(pump,15000);
window.addEventListener('online',()=>{ pump(); cloudSync(); });
function matchSub(catId,name){
  const c=S.cats.find(c=>c.id===catId); if(!c||!name) return null;
  const n=name.trim(); return (c.subs.find(s=>s.name===n)||c.subs.find(s=>s.name.includes(n)||n.includes(s.name))||{}).id||null;
}
async function runJob(j){
  qRun++; j.status='work'; updateHud(); refreshReview();
  try{
    if(j.off===undefined) j.off=await offLookup(j.barcode);
    const ph=await dbGet('photos',j.barcode);
    if(!ph){ j.status='nophoto'; return; }
    const cat=S.cats.find(c=>c.id===j.catId);
    const body={barcode:j.barcode,image:await blobToB64(ph.blob),category:cat?cat.name:'',subs:cat?cat.subs.map(s=>s.name):[],off:j.off||null};
    if(j.back) body.image2=await blobToB64(j.back);
    const r=await api('analyze',body);
    const a=r.result||{};
    j.ai=a; j.model=r.model; j.status='ready'; j.err='';
    j.d={name:a.name_ar||'',nameEn:a.name_en||'',brand:a.brand_ar||'',brandEn:a.brand_en||'',size:a.size||'',
      unit:UNITS.includes(a.unit)?a.unit:'غرام',subId:matchSub(j.catId,a.sub_category),subSuggest:a.sub_category||'',country:a.country||''};
  }catch(e){ j.status='error'; j.err=e.message; j.tries=(j.tries||0)+1; j.at=Date.now(); }
  finally{ qRun--; if(Q.has(j.barcode)) await dbPut('queue',j); updateHud(); refreshReview(); pump(); }
}

/* ---------- شاشة اختيار التصنيف ---------- */
function viewSmart(root){
  $('#title').textContent='الجمع الذكي';
  root.innerHTML=`
    ${cloudOn()?'':`<div class="alert"><div class="grow"><b>اضبط الاتصال أولاً</b><div class="muted">أدخل رابط الوظيفة والرمز السري من الإعدادات حتى يعمل الذكاء الاصطناعي. التصوير يعمل الآن، والقراءة تبدأ بعد الضبط.</div></div><button class="btn sm violet" id="goSet">الإعدادات</button></div>`}
    <div class="card glass"><b>طريقة العمل</b>
      <ol class="muted" style="padding-inline-start:18px;margin:6px 0 0">
        <li>اختر التصنيف (مثلاً الألبان) واجمع منتجاته فقط.</li>
        <li>الكاميرا على الباركود ← صوت "تيت".</li>
        <li>اقلب المنتج على وجهه وثبّته ← تُلتقط الصورة تلقائياً "تيت تيت".</li>
        <li>المنتج التالي مباشرة. القراءة تعمل في الخلفية، وتراجع كل شيء في النهاية.</li>
      </ol></div>
    ${Q.size?`<button class="btn ok block" id="goRev" style="margin-bottom:12px">المراجعة (<span class="num" id="revCount">${Q.size}</span>)</button>`:''}
    <h2>اختر التصنيف للبدء</h2>
    <div class="catgrid">${S.cats.map(c=>`<div class="cat glass ${c.id===S.set.smartCat?'sel':''}" data-c="${c.id}"><b>${esc(c.name)}</b><span><span class="num">${countIn(c.id)}</span> صنف</span></div>`).join('')}</div>`;
  const g=root.querySelector('#goSet'); if(g) g.onclick=()=>go('settings');
  const r=root.querySelector('#goRev'); if(r) r.onclick=()=>go('review');
  root.querySelectorAll('.cat').forEach(x=>x.onclick=()=>startSmart(x.dataset.c));
}

/* ---------- المراجعة ---------- */
let revTimer=null;
function refreshReview(){ if(cur()&&cur().name==='review'){ clearTimeout(revTimer); revTimer=setTimeout(()=>{ if(!document.activeElement||!document.activeElement.closest('.rv')) render(); },400); } }
const flagged=j=>j.status==='ready' && (j.ai.needs_back || (j.ai.confidence??1)<0.6);
function viewReview(root){
  $('#title').textContent='مراجعة الجمع الذكي';
  const jobs=[...Q.values()].sort((a,b)=>b.createdAt-a.createdAt);
  const ready=jobs.filter(j=>j.status==='ready'&&!flagged(j)), fl=jobs.filter(flagged);
  const busy=jobs.filter(j=>j.status==='wait'||j.status==='work').length;
  if(!jobs.length){ root.innerHTML=`<div class="empty">لا يوجد شيء للمراجعة.<br><br><button class="btn aurora" id="goS">ابدأ الجمع الذكي</button></div>`; root.querySelector('#goS').onclick=()=>go('smart'); return; }
  root.innerHTML=`
    <div class="stats">
      <div class="stat glass"><b class="num">${ready.length}</b><span>جاهزة</span></div>
      <div class="stat glass"><b class="num">${fl.length}</b><span>تحتاج نظرة</span></div>
      <div class="stat glass"><b class="num">${busy}</b><span>قيد القراءة</span></div>
    </div>
    ${!cloudOn()?'<div class="alert"><div class="grow">القراءة متوقفة: اضبط الاتصال من الإعدادات.</div></div>':''}
    ${ready.length?`<button class="btn ok lg block" id="saveAll" style="margin-bottom:12px">حفظ الكل الجاهزة (<span class="num">${ready.length}</span>)</button>`:''}
    <div id="rvList">${jobs.map(rvCard).join('')}</div>
    <button class="btn aurora block" id="more" style="margin-top:6px">متابعة الجمع</button>`;
  root.querySelector('#more').onclick=()=>{ go('smart'); };
  const sa=root.querySelector('#saveAll'); if(sa) sa.onclick=async()=>{
    let n=0; for(const j of ready){ if(await saveJob(j)) n++; }
    await saveMeta('set'); toast(`تم حفظ ${n} صنف`); cloudSync(); render();
  };
  root.querySelectorAll('[data-t]').forEach(async t=>{ const u=await thumbURL(t.dataset.t); if(u) t.outerHTML=`<img class="thumb rvimg" src="${u}" alt="">`; });
  root.querySelectorAll('.rv').forEach(card=>{
    const j=Q.get(card.dataset.b); if(!j) return;
    card.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=async()=>{
      const f=inp.dataset.f;
      if(f==='subId' && inp.value==='__new__'){
        const c=S.cats.find(c=>c.id===j.catId); const n=await ask(`تصنيف فرعي جديد في «${c?c.name:''}»`,j.d.subSuggest||'');
        if(n&&c){ let s=c.subs.find(s=>s.name===n); if(!s){ s={id:uid(),name:n}; c.subs.push(s); await saveMeta('cats'); } j.d.subId=s.id; }
        await dbPut('queue',j); render(); return;
      }
      j.d[f]=inp.value.trim(); await dbPut('queue',j);
    });
    card.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if(a==='save'){ if(await saveJob(j)){ await saveMeta('set'); toast('تم الحفظ'); cloudSync(); render(); } }
      else if(a==='del'){ if(!await confirmBox('حذف','حذف هذا المنتج من المراجعة وصورته؟')) return;
        Q.delete(j.barcode); await dbDel('queue',j.barcode);
        if(!S.items.has(j.barcode) && S.photoKeys.has(j.barcode)){ await dbDel('photos',j.barcode); S.photoKeys.delete(j.barcode); dropThumb(j.barcode); }
        updateHud(); render(); }
      else if(a==='retry'){ j.status='wait'; j.tries=0; await dbPut('queue',j); pump(); render(); }
      else if(a==='front'||a==='back'){
        const p=$('#photoInput'); p.value='';
        p.onchange=async()=>{ if(!p.files[0]) return;
          try{ const blob=await compress(p.files[0]);
            if(a==='front'){ await dbPut('photos',{barcode:j.barcode,blob}); S.photoKeys.add(j.barcode); dropThumb(j.barcode); }
            else j.back=blob;
            j.status='wait'; j.tries=0; await dbPut('queue',j); pump(); render(); toast('جارٍ القراءة من جديد…');
          }catch(e){ toast('تعذّر قراءة الصورة'); } };
        p.click();
      }
    });
  });
}
function rvCard(j){
  const thumb=`<div class="thumb" data-t="${esc(j.barcode)}">${IC.img}</div>`;
  const head=`<div class="row">${thumb}<div class="grow"><small class="num muted">${esc(j.barcode)}</small><br><small class="muted">${esc(catName(j.catId)||'')}</small></div>`;
  if(j.status==='wait'||j.status==='work') return `<div class="rv glass" data-b="${j.barcode}">${head}<span class="badge">⏳ ${j.status==='work'?'جارٍ القراءة':'بالانتظار'}</span></div></div>`;
  if(j.status==='nophoto') return `<div class="rv glass" data-b="${j.barcode}">${head}<span class="badge warn">بلا صورة</span></div>
    <div class="row" style="margin-top:8px"><button class="btn sm grow" data-a="front">${IC.cam}صوّر الوجه</button><button class="btn sm bad" data-a="del">${IC.del}</button></div></div>`;
  if(j.status==='error') return `<div class="rv glass" data-b="${j.barcode}">${head}<span class="badge bad">⚠ خطأ</span></div>
    <div class="muted" style="margin:6px 0">${esc(j.err||'')}</div>
    <div class="row"><button class="btn sm grow" data-a="retry">إعادة المحاولة</button><button class="btn sm bad" data-a="del">${IC.del}</button></div></div>`;
  const d=j.d, c=S.cats.find(c=>c.id===j.catId), a=j.ai||{};
  const badges=[a.needs_back?'<span class="badge warn">يحتاج صورة الخلف</span>':'',(a.confidence??1)<0.6?'<span class="badge warn">ثقة منخفضة</span>':'',j.off?'<span class="badge">OFF</span>':''].join(' ');
  return `<div class="rv glass ${flagged(j)?'flag':''}" data-b="${j.barcode}">${head}<div>${badges}</div></div>
    ${a.note?`<div class="muted" style="margin:6px 0">ملاحظة: ${esc(a.note)}</div>`:''}
    <div class="field"><label>الاسم بالعربي</label><input data-f="name" value="${esc(d.name)}"></div>
    <div class="field"><label>الاسم بالإنجليزي</label><input data-f="nameEn" class="en" dir="ltr" value="${esc(d.nameEn)}"></div>
    <div class="two">
      <div class="field"><label>الماركة</label><input data-f="brand" value="${esc(d.brand)}"></div>
      <div class="field"><label>Brand</label><input data-f="brandEn" dir="ltr" value="${esc(d.brandEn)}"></div>
    </div>
    <div class="two">
      <div class="field"><label>الحجم</label><input data-f="size" inputmode="decimal" value="${esc(d.size)}"></div>
      <div class="field"><label>الوحدة</label><select data-f="unit">${UNITS.map(u=>`<option ${u===d.unit?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>التصنيف الفرعي ${!d.subId&&d.subSuggest?`<span class="muted">(مقترح: ${esc(d.subSuggest)})</span>`:''}</label>
      <select data-f="subId"><option value="">— اختر —</option>${c?c.subs.map(s=>`<option value="${s.id}" ${s.id===d.subId?'selected':''}>${esc(s.name)}</option>`).join(''):''}<option value="__new__">＋ تصنيف فرعي جديد…</option></select></div>
    <div class="row"><button class="btn sm ok grow" data-a="save">✓ حفظ</button><button class="btn sm" data-a="back">${IC.cam}الخلف</button><button class="btn sm bad" data-a="del">${IC.del}</button></div>
  </div>`;
}
async function saveJob(j){
  const d=j.d; if(!d||!d.name){ toast('اكتب الاسم'); return false; }
  const now=Date.now(), ex=S.items.get(j.barcode);
  const rec={...(ex||{}),barcode:j.barcode,name:d.name,nameEn:d.nameEn,brand:d.brand,brandEn:d.brandEn,size:d.size,unit:d.unit,
    catId:j.catId||null,subId:d.subId||null,price:ex?ex.price:null,country:d.country||(ex&&ex.country)||'',notes:ex?ex.notes:'',extra:ex?ex.extra:{},
    src:'ai',ai:{model:j.model||'',conf:(j.ai||{}).confidence??null,off:!!j.off},createdAt:ex?ex.createdAt:now,updatedAt:now};
  rec.hasPhoto=S.photoKeys.has(j.barcode);
  await dbPut('items',rec); S.items.set(j.barcode,rec);
  if(!ex) S.set.sinceExport++;
  Q.delete(j.barcode); await dbDel('queue',j.barcode); updateHud();
  return true;
}

/* ---------- السحابة ---------- */
let syncing=false, cloudErr='';
const synced=i=>i.cloudAt && i.cloudAt>=(i.updatedAt||0);
async function cloudSync(){
  if(syncing||!cloudOn()||!navigator.onLine) return;
  syncing=true; cloudErr='';
  try{
    for(const it of [...S.items.values()]){
      if(synced(it)) continue;
      const body={item:{...it,catName:catName(it.catId),subName:subName(it.catId,it.subId)}};
      delete body.item.cloudAt;
      if(S.photoKeys.has(it.barcode)){ const p=await dbGet('photos',it.barcode); if(p) body.photo=await blobToB64(p.blob); }
      await api('save',body,60000);
      it.cloudAt=Date.now(); await dbPut('items',it); updateCloudChip();
    }
  }catch(e){ cloudErr=e.message; }
  finally{ syncing=false; updateCloudChip(); }
}
function updateCloudChip(){
  const el=$('#cloudChip'); if(!el) return;
  if(!cloudOn()){ el.innerHTML='☁️ السحابة غير مضبوطة'; el.className='badge warn'; return; }
  let n=0; S.items.forEach(i=>{ if(synced(i)) n++; });
  el.innerHTML=`☁️ في السحابة <span class="num">${n}</span> من <span class="num">${S.items.size}</span>${syncing?' …':''}`;
  el.className='badge '+(cloudErr?'bad':n===S.items.size?'ok':'warn');
  el.title=cloudErr;
}
async function cloudRestore(){
  let since=0, add=0, ph=0;
  for(let round=0;round<50;round++){
    const r=await api('list',{since});
    const rows=r.rows||[]; if(!rows.length) break;
    for(const row of rows){
      since=Math.max(since,row.client_updated_at||0);
      const ex=S.items.get(row.barcode);
      if(ex && (ex.updatedAt||0)>=(row.client_updated_at||0)) continue;
      let c=S.cats.find(c=>c.id===row.cat_id)||S.cats.find(c=>c.name===row.category);
      if(!c && row.category){ c={id:row.cat_id||uid(),name:row.category,subs:[]}; S.cats.push(c); }
      let s=c&&(c.subs.find(s=>s.id===row.sub_id)||c.subs.find(s=>s.name===row.sub_category));
      if(c && !s && row.sub_category){ s={id:row.sub_id||uid(),name:row.sub_category}; c.subs.push(s); }
      const it={barcode:row.barcode,name:row.name_ar||'',nameEn:row.name_en||'',brand:row.brand_ar||'',brandEn:row.brand_en||'',size:row.size||'',unit:row.unit||'غرام',
        catId:c?c.id:null,subId:s?s.id:null,price:row.price,country:row.country||'',notes:row.notes||'',extra:row.extra||{},src:row.source||'',
        createdAt:row.client_created_at||Date.now(),updatedAt:row.client_updated_at||Date.now()};
      const url=row.photo_path&&r.photos[row.photo_path];
      if(url){ try{ const b=await (await fetch(url)).blob(); await dbPut('photos',{barcode:row.barcode,blob:new Blob([b],{type:'image/jpeg'})}); S.photoKeys.add(row.barcode); dropThumb(row.barcode); ph++; }catch(e){} }
      it.hasPhoto=S.photoKeys.has(row.barcode); it.cloudAt=Date.now();
      await dbPut('items',it); S.items.set(it.barcode,it); add++;
    }
    if(rows.length<1000) break;
  }
  await saveMeta('cats');
  return {add,ph};
}
function cloudCard(){
  return `<div class="card glass">
    <h2>الجمع الذكي والسحابة</h2>
    <p class="muted">الرابط والرمز من دليل التركيب. المفتاح السري لـ Claude لا يُكتب هنا أبداً — هو محفوظ داخل الوظيفة على الخادم.</p>
    <div class="field"><label>رابط الوظيفة</label><input id="cUrl" dir="ltr" placeholder="https://xxxx.supabase.co/functions/v1/smart-collect" value="${esc(S.set.cloudUrl||'')}"></div>
    <div class="field"><label>الرمز السري</label><input id="cPin" type="password" value="${esc(S.set.cloudPin||'')}"></div>
    <div class="field"><label>سرعة التصوير التلقائي</label><select id="cSens">
      <option value="fast" ${S.set.smartSens==='fast'?'selected':''}>سريع (يلتقط أبكر)</option>
      <option value="normal" ${(S.set.smartSens||'normal')==='normal'?'selected':''}>عادي</option>
      <option value="strict" ${S.set.smartSens==='strict'?'selected':''}>دقيق (ينتظر ثباتاً أطول)</option></select></div>
    <div class="two"><button class="btn ok" id="cSave">حفظ واختبار</button><button class="btn ghost" id="cUp">رفع الكل الآن</button></div>
    <button class="btn ghost block" id="cDown" style="margin-top:10px">${IC.down}استرجاع المكتبة من السحابة</button>
    <div class="muted" id="cMsg" style="margin-top:10px"><span id="cloudChip" class="badge"></span></div>
  </div>`;
}
function bindCloudCard(){
  updateCloudChip();
  $('#cSens').onchange=async()=>{ S.set.smartSens=$('#cSens').value; await saveMeta('set'); };
  $('#cSave').onclick=async()=>{
    S.set.cloudUrl=$('#cUrl').value.trim(); S.set.cloudPin=$('#cPin').value.trim(); await saveMeta('set');
    try{ const r=await api('ping',{},20000);
      toast(r.hasKey?`متصل ✓ — النموذج ${r.model} — في السحابة ${r.count}`:'متصل، لكن مفتاح Claude غير موجود في الوظيفة');
      pump(); cloudSync();
    }catch(e){ toast('فشل الاتصال: '+e.message); }
    updateCloudChip();
  };
  $('#cUp').onclick=()=>{ cloudSync(); toast('بدأ الرفع في الخلفية'); };
  $('#cDown').onclick=async()=>{
    if(!await confirmBox('استرجاع من السحابة','تُنزَّل الأصناف والصور من السحابة وتُدمج مع الموجود (الأحدث يُعتمد). متابعة؟',false)) return;
    toast('جارٍ الاسترجاع…');
    try{ const r=await cloudRestore(); toast(`تم: ${r.add} صنف و${r.ph} صورة`); render(); }catch(e){ toast('فشل: '+e.message); }
  };
}
